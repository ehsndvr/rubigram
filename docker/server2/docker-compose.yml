# Worker server: PostgreSQL + Redis + API (Daphne) + Celery worker + beat + nginx.
#   cp .env.example .env   # fill in the secrets
#   docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rubigram_worker}
      POSTGRES_USER: ${POSTGRES_USER:-rubigram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rubigram}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker-api:
    build:
      context: ../..
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-celery:
    build:
      context: ../..
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    command: celery -A membership_worker.project.celery worker -l INFO -Q membership,callbacks,default --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    env_file: .env
    depends_on:
      worker-api:
        condition: service_started

  worker-beat:
    build:
      context: ../..
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    command: celery -A membership_worker.project.celery beat -l INFO
    env_file: .env
    depends_on:
      worker-api:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - worker-api

volumes:
  postgres_data:
  redis_data:
  certbot_certs:
  certbot_www:
