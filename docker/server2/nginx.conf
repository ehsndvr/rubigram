# Worker server — internal API called only by the panel.  Replace worker.example.com.

server {
    listen 80;
    server_name worker.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name worker.example.com;

    ssl_certificate     /etc/letsencrypt/live/worker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worker.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 1M;

    # Every request is HMAC-signed by the panel; add an allow/deny block with the
    # panel's IP here for a second layer.
    location / {
        proxy_pass         http://worker-api:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # the login endpoints wait for Rubika
    }
}
