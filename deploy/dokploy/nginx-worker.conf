# Host nginx site for the Dokploy-deployed worker (only when you do NOT use a
# Dokploy Domain / Traefik).  Install as /etc/nginx/sites-available/rubigram-worker
# and proxy to the port published by docker/server2/dokploy-compose.yml (WORKER_PORT).
#
#   cp deploy/dokploy/nginx-worker.conf /etc/nginx/sites-available/rubigram-worker
#   ln -sf /etc/nginx/sites-available/rubigram-worker /etc/nginx/sites-enabled/rubigram-worker
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d worker.example.com

upstream rubigram_worker {
    server 127.0.0.1:8092;    # WORKER_PORT (prod); use 8093 for a test stack
    keepalive 16;
}

server {
    listen 80;
    server_name worker.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name worker.example.com;

    ssl_certificate     /etc/letsencrypt/live/worker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worker.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1M;

    # Every request is HMAC-signed by the panel; restrict further by IP if you like:
    # allow <panel ip>; deny all;

    location / {
        proxy_pass         http://rubigram_worker;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;    # the login endpoints wait for Rubika
    }
}
