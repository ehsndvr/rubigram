# /etc/nginx/sites-available/rubigram-worker — internal API called only by the panel.
server {
    listen 80;
    server_name worker.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name worker.example.com;

    ssl_certificate     /etc/letsencrypt/live/worker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worker.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # allow <panel ip>; deny all;   # optional second layer next to the HMAC signatures

    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
