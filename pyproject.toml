[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubigram"
version = "0.1.0"
description = "A modern Python client library for Rubika"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Ehsan Davari" }
]
dependencies = [
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "websockets>=12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
